name: Gather public IP address ranges data from different public cloud providers 

on:
  workflow_dispatch:
    
  schedule:
    # Run everyday at 4AM UTC
    - cron:  '0 4 * * *'

jobs:

  gather_and_transform_data:
    name: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install libxml2-utils jq

      - name: Install DuckDB
        run: bash scripts/01_install_duckdb.sh

      - name: Download cloud provider datasets and create DuckDB tables
        run: bash scripts/02_download_data.sh

      - name: Export provider data
        run: bash scripts/03_export_provider_data.sh

      - name: Create DuckDB database
        run: bash scripts/04_create_database.sh
      
      - name: Check for changes
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'danilabs@users.noreply.github.com'
          git remote set-url --push origin https://danilabs:$GITHUB_TOKEN@github.com/danilabs/public-cloud-provider-ip-ranges/
          git add .
          # Check for changes
          git diff-index --cached --quiet HEAD || echo '::set-output name=changed::true'

      - name: Eventually publish new data
        if: ${{ steps.check.outputs.changed == 'true' }}
        run: |
          git commit -am "[no ci] Data update on $(date '+%FT%H:%M:%S')"
          git push
